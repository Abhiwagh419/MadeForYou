# Cloudflare Pages project: the website, the API (functions/) and the database and photo storage it uses.
name = "madeforyou"
compatibility_date = "2026-09-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "madeforyou"
database_id = "ce081e99-00ce-4972-a170-35210740392d"
migrations_dir = "../../packages/api/migrations"

# Photos are stored in the database by default, so no payment card is needed.
# If you later enable R2 (Cloudflare asks for a card, though the free tier is 10 GB), create a bucket and
# uncomment these three lines; new photos then go to R2 instead.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "madeforyou-files"

[vars]
ALLOW_DEV_AUTH = "0"
# Set these as secrets, not here:  SESSION_SECRET  CLERK_JWKS_URL  CLERK_ISSUER  ADMIN_TOKEN
