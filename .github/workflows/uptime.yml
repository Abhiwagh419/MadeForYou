name: Uptime check
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SITE_URL != ''
    steps:
      - name: Check the site and the API
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 20 "${{ vars.SITE_URL }}/" -o /dev/null
          curl -fsS --retry 3 --retry-delay 10 --max-time 20 "${{ vars.SITE_URL }}/api/health" | grep -q '"ok":true'
